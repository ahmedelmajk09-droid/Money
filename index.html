<!DOCTYPE html>
<html>
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Money App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { background-color: #05070A; margin: 0; }
    .loader {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: white; font-family: sans-serif;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #536DFE;
      border-top: 4px solid transparent; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" class="loader">
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p>Starting Money App...</p>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            useHtml: true, 
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
