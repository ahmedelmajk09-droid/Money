<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ahmed Finance App">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Money App</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #05070A; margin: 0; padding: 0;">
  
  <div id="loading-indicator" style="display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif;">
    <div style="text-align: center;">
      <div style="width: 50px; height: 50px; border: 5px solid #536DFE; border-top: 5px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
      <p style="font-size: 18px; font-weight: bold;">Loading Money App...</p>
    </div>
  </div>

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // إخفاء اللودر أول ما الأبلكيشن يبدأ يرسم أول فريم
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
